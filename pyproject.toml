[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "anpr-os-fayz"
version = "1.0.0"
description = "Сбор проездов с Dahua ANPR-камеры в Telegram, локальный сервис и мониторинг"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "ANPR OS Fayz" }]
keywords = ["anpr", "dahua", "telegram", "traffic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Верхние границы обязательны: сборка не должна «поехать» при обновлении пакета.
dependencies = [
    "requests>=2.32,<3",
    "Pillow>=10.4,<13",
    "tzdata>=2024.1,<2027",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "customtkinter>=5.2,<6",
    "pystray>=0.19,<1",
    "opencv-python-headless>=4.10,<6",
]

[project.urls]
Documentation = "https://github.com/evrika/anpr-os-fayz#readme"

[project.scripts]
anpr-service = "service_control:start"

[tool.setuptools]
py-modules = [
    "anpr_telegram",
    "app",
    "app_preferences",
    "control_panel",
    "dashboard",
    "event_images",
    "panel_instance",
    "passage_photos",
    "photo_archive",
    "service_control",
    "setup_anpr",
    "storage",
    "system_events",
]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
