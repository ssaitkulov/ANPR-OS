[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "anpr-os-fayz"
version = "1.0.0"
description = "Сбор проездов с Dahua ANPR-камеры в Telegram, локальный сервис и мониторинг"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "ANPR OS Fayz" }]
keywords = ["anpr", "dahua", "telegram", "traffic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Версии зафиксированы (==): это приложение, а не библиотека — сборка должна
# воспроизводиться. Полный набор с транзитивными зависимостями — в
# requirements-lock.txt, здесь — только прямые зависимости.
dependencies = [
    "requests==2.32.5",
    "Pillow==12.3.0",
    "tzdata==2026.3",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "customtkinter==5.2.2",
    "pystray==0.19.5",
    "opencv-python-headless==5.0.0.93",
]

[project.urls]
Documentation = "https://github.com/evrika/anpr-os-fayz#readme"

[project.scripts]
anpr-service = "app.services.control:start"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools]
# Код приложения лежит в пакете `app`; корневые файлы (app.py,
# control_panel.py, setup_anpr.py, anpr_telegram.py) — совместимые
# точки входа, они запускаются как скрипты, а не как модули пакета.
packages = [
    "app",
    "app.core",
    "app.services",
    "app.storage",
    "app.ui",
]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
