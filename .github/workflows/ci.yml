name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # Приложение использует winreg и tkinter, поэтому проверка идёт на Windows.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Установить Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt

      # Ставим ограниченные диапазоны из requirements.txt: так CI ловит
      # выход новой версии пакета за верхнюю границу.
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Проверить, что импорт не создаёт рабочую базу и состояние
        run: |
          python -c "import anpr_telegram"
          if (Test-Path anpr.sqlite3) { throw "Импорт создал anpr.sqlite3 в рабочей папке" }
          if (Test-Path anpr_state.json) { throw "Импорт создал anpr_state.json в рабочей папке" }

      - name: Тесты
        run: python -m pytest -q
