name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # Приложение использует winreg и tkinter, поэтому проверка идёт на Windows.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Этап 3: поддерживаются 3.11–3.14 (совпадает с requires-python в pyproject.toml).
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Установить Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt

      # Ставим зафиксированные версии из requirements.txt: CI проверяет
      # именно ту сборку, которая идёт в бой.
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      # Этап 3: битые зависимости (конфликт версий) — тоже падение сборки.
      - name: Проверить зависимости (pip check)
        run: python -m pip check

      # Этап 4: версии в requirements.txt, requirements-lock.txt и pyproject.toml
      # должны совпадать — иначе машины поставят разные наборы.
      - name: Проверить согласованность файлов зависимостей
        run: python scripts/check_lock.py

      - name: Проверить, что импорт не создаёт рабочую базу и состояние
        run: |
          python -c "import anpr_telegram"
          if (Test-Path anpr.sqlite3) { throw "Импорт создал anpr.sqlite3 в рабочей папке" }
          if (Test-Path anpr_state.json) { throw "Импорт создал anpr_state.json в рабочей папке" }

      # Этап 3: основной прогон. Раннер один — pytest: у него есть teardown
      # изоляции (join_threads/finalize в tests/conftest.py), которого нет у
      # unittest discover. Второй полный прогон того же набора не давал
      # ничего, но стоил ещё ~3 минуты на каждую версию Python.
      - name: Тесты (pytest)
        run: python -m pytest -q

      # Совместимость со стандартной библиотекой: набор должен запускаться и
      # без pytest (так работает хук и запасной путь на машине без pytest).
      # Быстрая выборка вместо второго полного прогона.
      - name: Тесты (совместимость с unittest)
        run: python -m unittest tests.test_safe_mode tests.test_control_auth tests.test_paths

      # Этап 3: тесты не должны трогать рабочую базу, состояние и подписчиков.
      - name: Проверить, что тесты не тронули рабочие файлы
        run: |
          if (Test-Path anpr.sqlite3) { throw "Тесты создали anpr.sqlite3 в рабочей папке" }
          if (Test-Path anpr.sqlite3-wal) { throw "Тесты создали anpr.sqlite3-wal в рабочей папке" }
          if (Test-Path anpr_state.json) { throw "Тесты создали anpr_state.json в рабочей папке" }
          if (Test-Path subscribers.json) { throw "Тесты создали subscribers.json в рабочей папке" }
